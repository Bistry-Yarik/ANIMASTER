name: Build and publish AMS for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v2.0.0)
        required: true
        default: v2.0.0

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2.0.0' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2.0.0' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned build dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Check application
        id: check
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Verify editor in Chrome
        id: browser
        env:
          BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: npm run test:ui
      - name: Build Windows portable EXE
        id: build
        run: npm run build:win
      - name: Calculate checksum
        shell: pwsh
        run: |
          Get-FileHash dist/AMS-*-Windows.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Publish downloadable release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/AMS-*-Windows.exe dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/AMS-*-Windows.exe dist/SHA256SUMS.txt --verify-tag --repo "$GITHUB_REPOSITORY" --title "AMS $RELEASE_TAG — Windows" --notes-file desktop/RELEASE-NOTES.md
          fi
      - name: Save release result for verification over Git
        if: always()
        shell: pwsh
        env:
          RELEASE_RESULT: ${{ job.status }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git switch --force-create release-report origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = [ordered]@{
            status = $env:RELEASE_RESULT
            tag = $env:RELEASE_TAG
            source_commit = $env:RELEASE_SOURCE
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            release_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
            install_result = '${{ steps.install.outcome }}'
            check_result = '${{ steps.check.outcome }}'
            browser_result = '${{ steps.browser.outcome }}'
            build_result = '${{ steps.build.outcome }}'
            publish_result = '${{ steps.publish.outcome }}'
            completed_at = [DateTime]::UtcNow.ToString('o')
          }
          $report | ConvertTo-Json | Set-Content desktop/release-status.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/release-status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Report Windows release result"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
